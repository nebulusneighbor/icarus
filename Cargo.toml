[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/nebulusneighbor/icarus"

[workspace.dependencies]
icarus-model = { path = "crates/icarus-model" }
icarus-engine = { path = "crates/icarus-engine" }
icarus-analysis = { path = "crates/icarus-analysis" }
icarus-render = { path = "crates/icarus-render" }
icarus-session = { path = "crates/icarus-session" }
icarus-pipewire = { path = "crates/icarus-pipewire" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
rayon = "1.12.0"
rustfft = "6.4.1"
hound = "3.5.1"
rtrb = "0.4.0"
pipewire = { version = "0.10.1", features = ["v0_3_49"] }
clap = { version = "4.6.7", features = ["derive"] }
anyhow = "1.0.104"
rosc = "0.11.4"

[profile.dev]
opt-level = 1
