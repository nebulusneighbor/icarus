name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install PipeWire headers
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev pkg-config clang
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo run --release -- demo --out target/demo.wav
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: GUI end-to-end (headless Chrome + an agent on the socket)
        run: node scripts/gui-smoke.mjs target/release/icarus google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-screenshots
          path: target/gui-*.png
